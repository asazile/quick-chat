<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Chat · 临时聊天室</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .app {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      max-height: 720px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #4b3f72;
      color: #fff;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    .online { font-size: 12px; opacity: .85; }
    .right { display: flex; align-items: center; gap: 8px; }
    input.name {
      width: 110px;
      padding: 5px 8px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      background: #fff;
      color: #4b3f72;
    }
    button:hover { background: #f0eef7; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #f7f7fa;
    }
    .msg { margin-bottom: 10px; line-height: 1.4; }
    .msg .meta { font-size: 12px; color: #888; margin-bottom: 2px; }
    .msg .bubble {
      display: inline-block;
      padding: 8px 12px;
      background: #fff;
      border-radius: 12px;
      border: 1px solid #eee;
      max-width: 80%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.me { text-align: right; }
    .msg.me .bubble { background: #4b3f72; color: #fff; border-color: #4b3f72; }
    .system {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin: 8px 0;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #eee;
    }
    #input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    #input:focus { border-color: #667eea; }
    form button {
      padding: 10px 16px;
      background: #667eea;
      color: #fff;
    }
    form button:hover { background: #5468d8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle; }
    .dot.on { background: #5fd76b; }
    .dot.off { background: #d75f5f; }
    @media (max-width: 500px) {
      .app { height: 100vh; max-height: none; border-radius: 0; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Quick Chat</h1>
        <div class="online"><span id="dot" class="dot off"></span><span id="online">连接中…</span></div>
      </div>
      <div class="right">
        <input id="name" class="name" placeholder="昵称" maxlength="20" />
        <button id="rename">改名</button>
      </div>
    </header>

    <div id="messages"></div>

    <form id="form">
      <input id="input" placeholder="输入消息，回车发送" autocomplete="off" maxlength="1000" />
      <button type="submit">发送</button>
    </form>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const nameInput = document.getElementById('name');
    const renameBtn = document.getElementById('rename');
    const onlineEl = document.getElementById('online');
    const dotEl = document.getElementById('dot');

    // 用 wss://（https 部署后自动兼容），本地 http 用 ws://
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}`);

    let myName = '';

    function addSystem(text) {
      const div = document.createElement('div');
      div.className = 'system';
      div.textContent = text;
      messagesEl.appendChild(div);
      scrollDown();
    }

    function addMessage(name, text, ts) {
      const div = document.createElement('div');
      div.className = 'msg' + (name === myName ? ' me' : '');
      const time = new Date(ts || Date.now()).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      div.innerHTML = `<div class="meta">${escapeHtml(name)} · ${time}</div>
                       <div class="bubble">${escapeHtml(text)}</div>`;
      messagesEl.appendChild(div);
      scrollDown();
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function scrollDown() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    ws.onopen = () => {
      dotEl.className = 'dot on';
      onlineEl.textContent = '已连接';
    };

    ws.onmessage = (e) => {
      let m;
      try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'system') {
        addSystem(m.text);
        if (typeof m.online === 'number') onlineEl.textContent = `${m.online} 人在线`;
      } else if (m.type === 'message') {
        addMessage(m.name, m.text, m.ts);
      } else if (m.type === 'rename-ok') {
        myName = m.name;
        nameInput.value = m.name;
      }
    };

    ws.onclose = () => {
      dotEl.className = 'dot off';
      onlineEl.textContent = '已断开';
      addSystem('连接已断开，刷新页面重试。');
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'message', text }));
      input.value = '';
      input.focus();
    });

    renameBtn.addEventListener('click', () => {
      const name = nameInput.value.trim();
      if (!name || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'rename', name }));
    });
    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') renameBtn.click();
    });
  </script>
</body>
</html>
